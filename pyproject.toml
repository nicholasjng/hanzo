[build-system]
requires = ["packaging>=26.0"]
build-backend = "hanzo" # TODO: Add bootstrap module to avoid requires duplication above
backend-path = ["src"]

[project]
name = "hanzo"
version = "0.1.0"
description = "A small, extensible build backend for Python"
keywords = ["packaging", "wheel", "pep517", "pep660"]
readme = "README.md"
license = "Apache-2.0"

requires-python = ">=3.11"
dependencies = [
    "packaging>=26.0",
]

[dependency-groups]
ninja = [
    "ninja>=1.13.0",
]
tests = [
    "build>=1.4.0",
    "pytest>=9.0.2",
]
zed = [
    "pyrefly>=0.60.0",
    "ruff>=0.15.2",
    "ty>=0.0.29",
]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"
exclude = ["tests/projects/**", "src/hanzo/vendor/**"]

[tool.ruff.lint]
# Enable pycodestyle errors & warnings (`E`, `W`), bandit (`S`), Pyflakes (`F`),
# isort (`I`), and pyupgrade (`UP`) by default.
select = ["E", "F", "I", "S", "W", "UP"]
ignore = ["E203", "E501"]

[tool.ruff.lint.per-file-ignores]
"src/hanzo/rules.py" = ["E501"]  # line overruns in rule definitions.
"tests/**/*.py" = ["S"]  # asserts in test cases.

[tool.pyrefly]
#### configuring what to type check and where to import from
project-excludes = ["tests/projects/**", "src/hanzo/vendor/**"]
