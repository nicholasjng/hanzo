[build-system]
requires = ["packaging>=26.0", "pyproject-metadata>=0.10.0"]
build-backend = 'hanzo' # TODO: Add bootstrap module to avoid requires duplication above
backend-path = ['src']

[project]
name = "hanzo"
version = "0.1.0"
description = "A small, extensible build backend for Python"
keywords = ["packaging", "wheel", "pep517", "pep660"]
readme = "README.md"
license = "Apache-2.0"

requires-python = ">=3.11"
dependencies = [
    "ninja>=1.10.0",
    "packaging>=26.0",
    "pyproject-metadata>=0.10.0",
]

[dependency-groups]
tests = [
    "build>=1.4.0",
    "pytest>=9.0.2",
]
zed = [
    "pyrefly>=0.60.0",
    "ruff>=0.15.2",
    "ty>=0.0.29",
]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"
exclude = ["tests/projects/**"]

[tool.ruff.lint]
# Enable pycodestyle errors & warnings (`E`, `W`), bandit (`S`), Pyflakes (`F`),
# isort (`I`), and pyupgrade (`UP`) by default.
select = ["E", "F", "I", "S", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/hanzo/rules.py" = ["E501"]  # line overruns in rule definitions.

[tool.pyrefly]
#### configuring what to type check and where to import from
project-excludes = ["tests/projects/**"]
