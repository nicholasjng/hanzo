[build-system]
requires = ["hanzo", "nanobind"]
build-backend = "hanzo"

[project]
name = "hello-cc"
version = "0.1.0"
keywords = ["hello", "c++"]
requires-python = ">=3.10"

[tool.uv.sources]
hanzo = { path = "../../..", editable = true }

[tool.hanzo]
wheel.stable-abi = ">=3.12"

cc.export_compile_commands = true

[tool.hanzo.targets.nanobind]
type = "cc-library"
rootpath = "@python.site/nanobind"
sources = [
    { include = ["src/*.cpp", "src/*.h"], exclude = ["src/nb_combined.cpp"] }
]
includes = [
    "include",
    { path = "ext/robin_map/include", system = true, local = true },
    "@python.include",
]
features = ["stable-abi"]
flags.macos = ["-fPIC", "-fvisibility=hidden", "-fno-strict-aliasing"]
flags.linux = ["-fPIC", "-fvisibility=hidden", "-fno-strict-aliasing", "-ffunction-sections", "-fdata-sections"]
linkflags.macos = [
    "-bundle",
    "-Wl,-headerpad_max_install_names",
    "-Wl,@@rootpath/cmake/darwin-ld-cpython.sym",
    "-Wl,-dead_strip",
    "-Wl,-x",
    "-Wl,-S",
]
linkflags.linux = ["-shared", "-Wl,--gc-sections", "-Wl,-s"]

[tool.hanzo.targets.hello_ext]
type = "cc-extension"
sources = ["src/hello_ext.cc"]
dependencies = ["nanobind"]
